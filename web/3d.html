<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ribbit's Big Adventure - 3D Diorama Edition (Three.js)</title>
    <meta name="description" content="Explore Ribbit's Big Adventure in an interactive 3D Three.js diorama with dynamic lighting and camera controls.">
    <meta property="og:title" content="Ribbit's Big Adventure - 3D Diorama Edition">
    <meta property="og:description" content="Interactive 3D Three.js swamp diorama starring Ribbit the frog.">
    <meta property="og:image" content="/banner.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Google Retro Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030a0d;
            font-family: 'JetBrains Mono', monospace, sans-serif;
            color: #f1f5f9;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
            overscroll-behavior: none;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* --- TACTICAL 3D HUD OVERLAY --- */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(2, 6, 8, 0.75) 0%, rgba(2, 6, 8, 0) 100%);
        }

        .hud-left {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        .title-badge {
            background: rgba(6, 78, 59, 0.35);
            border: 1px solid rgba(52, 211, 153, 0.4);
            padding: 6px 14px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(5, 46, 22, 0.4);
        }

        .title-main {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .title-sub {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .hud-stats {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        .stat-card {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(51, 65, 85, 0.6);
            padding: 6px 12px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
            font-size: 11px;
            font-weight: 600;
        }

        .hud-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }

        .hud-btn {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(51, 65, 85, 0.8);
            color: #cbd5e1;
            padding: 6px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            backdrop-filter: blur(8px);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .hud-btn:hover {
            background: rgba(30, 41, 59, 0.9);
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
            transform: translateY(-1px);
        }

        .hud-btn:active {
            transform: translateY(1px);
        }

        .btn-stage {
            padding: 6px 9px;
            font-size: 10px;
        }

        .btn-stage.active {
            background: rgba(16, 185, 129, 0.25);
            border-color: #10b981;
            color: #6ee7b7;
        }

        /* --- BOTTOM CONTROLS & HINTS BAR --- */
        #bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(0deg, rgba(2, 6, 8, 0.85) 0%, rgba(2, 6, 8, 0) 100%);
            font-size: 11px;
            color: #64748b;
        }

        #bottom-bar span {
            color: #38bdf8;
            font-weight: 600;
        }

        /* --- MOBILE TOUCH CONTROLS (Auto visible on touch devices) --- */
        #touch-controls {
            position: absolute;
            bottom: 24px;
            left: 0;
            width: 100%;
            padding: 0 24px;
            display: none;
            justify-content: space-between;
            z-index: 20;
            pointer-events: none;
        }

        .touch-group {
            display: flex;
            gap: 16px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            touch-action: none;
            active: scale(0.92);
        }

        @media (pointer: coarse) {
            #touch-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- 3D Three.js Viewport -->
    <div id="game-container"></div>

    <!-- HUD Overlay -->
    <header id="hud">
        <div class="hud-left">
            <div class="title-badge">
                <div class="title-main">
                    RIBBIT 3D // <span style="color:#38bdf8;">DIORAMA</span>
                </div>
                <div class="title-sub" id="level-name">Loading Swamp...</div>
            </div>

            <!-- Stage Select -->
            <div class="hud-controls">
                <button class="hud-btn btn-stage" onclick="window.frog3d.buildLevel(0)" title="Lilypad Lagoon">L1</button>
                <button class="hud-btn btn-stage" onclick="window.frog3d.buildLevel(1)" title="Cattail Canopy">L2</button>
                <button class="hud-btn btn-stage" onclick="window.frog3d.buildLevel(2)" title="Mushroom Mire">L3</button>
                <button class="hud-btn btn-stage" onclick="window.frog3d.buildLevel(3)" title="The Sunken Citadel">L4</button>
                <button class="hud-btn btn-stage" onclick="window.frog3d.buildLevel(4)" title="Firefly Marsh (JEV)">L5</button>
            </div>
        </div>

        <div class="hud-stats">
            <div class="stat-card" title="Fireflies Collected">
                <span style="font-size:10px; color:#facc15;">FF</span>
                <span id="firefly-count">0 / 0</span>
            </div>

            <div class="hud-controls">
                <button id="cam-toggle-btn" class="hud-btn" onclick="window.frog3d.cycleCameraMode()">
                    CAM: DIORAMA
                </button>
                <button id="audio-toggle-btn" class="hud-btn" onclick="toggleAudio()">
                    SOUND: ON
                </button>
                <a href="/" class="hud-btn" style="background:#14532d; border-color:#22c55e; color:#bbf7d0;">
                    2D CLASSIC
                </a>
            </div>
        </div>
    </header>

    <!-- Bottom Hints -->
    <footer id="bottom-bar">
        <div>
            <span>A / D / ARROWS</span> Run &bull; <span>SPACE / W</span> Jump (Hold for high leap) &bull; <span>J / X / CLICK</span> Tongue Whip
        </div>
        <div id="stage-badge" style="font-family:'Press Start 2P'; font-size:9px; color:#10b981;">
            STAGE 1 OF 5
        </div>
    </footer>

    <!-- Mobile Virtual Gamepad -->
    <div id="touch-controls">
        <div class="touch-group">
            <div class="touch-btn" id="btn-left">&lt;</div>
            <div class="touch-btn" id="btn-right">&gt;</div>
        </div>
        <div class="touch-group">
            <div class="touch-btn" id="btn-tongue" style="border-color:#f43f5e; color:#fda4af;">LASH</div>
            <div class="touch-btn" id="btn-jump" style="border-color:#10b981; color:#a7f3d0;">JUMP</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/three.min.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/game3d.js"></script>

    <script>
        // Audio Toggle
        function toggleAudio() {
            if (window.frog3d && window.frog3d.soundEngine) {
                const muted = window.frog3d.soundEngine.toggleMute();
                document.getElementById('audio-toggle-btn').textContent = muted ? 'SOUND: OFF' : 'SOUND: ON';
            }
        }

        // Camera Toggle HUD label updater
        const camBtn = document.getElementById('cam-toggle-btn');
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyC') {
                updateCamLabel();
            }
        });
        function updateCamLabel() {
            if (window.frog3d) {
                camBtn.textContent = window.frog3d.cameraMode === 'diorama' ? 'CAM: DIORAMA' : 'CAM: SIDE';
            }
        }

        // Mobile Touch Listeners
        const setupTouch = (btnId, keyName) => {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            const press = (e) => { e.preventDefault(); if (window.frog3d) window.frog3d.keys[keyName] = true; };
            const release = (e) => { e.preventDefault(); if (window.frog3d) window.frog3d.keys[keyName] = false; };
            btn.addEventListener('pointerdown', press);
            btn.addEventListener('pointerup', release);
            btn.addEventListener('pointercancel', release);
        };
        setupTouch('btn-left', 'left');
        setupTouch('btn-right', 'right');
        setupTouch('btn-jump', 'jump');
        
        const tongueBtn = document.getElementById('btn-tongue');
        if (tongueBtn) {
            tongueBtn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (window.frog3d) window.frog3d.triggerTongue();
            });
        }
    </script>
</body>
</html>
