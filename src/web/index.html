<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ribbit's Big Adventure - Deluxe Frog Platformer</title>
    <meta name="description" content="Play Ribbit's Big Adventure, a retro 16-bit platformer starring Ribbit the frog across enchanted swamp worlds.">
    <meta property="og:title" content="Ribbit's Big Adventure">
    <meta property="og:description" content="Jump into the swamp lagoon with Ribbit! 16-bit retro platformer action playable right in your browser.">
    <meta property="og:image" content="/banner.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Google Retro Arcade Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script>
        window.browserErrors = [];
        window.announceGame = function(message) {
            const region = document.getElementById('game-announcements');
            if (region) region.textContent = message;
        };
        window.onerror = function(msg, url, line, col, error) {
            const errStr = `[JS_ERROR] ${msg} at ${url}:${line}:${col}`;
            console.error(errStr);
            window.browserErrors.push(errStr);
        };
        const origErr = console.error;
        console.error = function(...args) {
            origErr.apply(console, args);
            if (['localhost', '127.0.0.1'].includes(location.hostname)) {
                fetch('/log_error', { method: 'POST', body: '[CONSOLE_ERR] ' + args.join(' ') }).catch(() => {});
            }
        };
    </script>
    <style>
        :root {
            --ink: #e8fff0;
            --muted: #88a99a;
            --panel: rgba(4, 22, 17, 0.92);
            --panel-border: rgba(74, 222, 128, 0.38);
            --accent: #4ade80;
            --accent-strong: #22c55e;
            --focus: #fde047;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            touch-action: manipulation;
            overscroll-behavior: none;
            overflow-x: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #050b12;
            background-image: 
                radial-gradient(ellipse at 50% 10%, #0d381c 0%, transparent 65%),
                radial-gradient(circle at 80% 80%, #0c2138 0%, transparent 55%),
                radial-gradient(circle at 20% 90%, #1e1338 0%, transparent 50%);
            color: #f1f5f9;
            font-family: 'Press Start 2P', monospace, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            overflow-x: hidden;
            overflow-y: auto;
            padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
        }

        #game-wrapper {
            position: relative;
            box-shadow: 
                0 0 0 4px #15803d,
                0 0 0 6px #052e16,
                0 0 40px rgba(34, 197, 94, 0.4),
                0 25px 50px rgba(0, 0, 0, 0.9);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            width: min(960px, calc(100vw - 20px));
            aspect-ratio: 16 / 9;
            max-width: 100vw;
            max-height: calc(100dvh - 150px);
            touch-action: none;
            overscroll-behavior: none;
        }

        #game-canvas-container {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
            touch-action: none;
            overscroll-behavior: none;
        }

        /* Optional CRT Arcade Scanline & Vignette Overlay */
        #crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 3px, 6px 100%;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.6);
            display: block;
            z-index: 999;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Top control bar */
        #top-nav {
            width: min(960px, calc(100vw - 20px));
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 8px 10px;
            font-size: 11px;
            color: #86efac;
            letter-spacing: 1px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
        }

        .brand {
            min-width: 0;
            color: var(--ink);
            line-height: 1.25;
        }

        .brand small {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 6px;
            letter-spacing: 1.5px;
        }

        .btn-group {
            display: flex;
            justify-content: flex-start;
            gap: 8px;
            min-width: 0;
            overflow-x: auto;
            padding: 3px;
            scrollbar-width: thin;
            scrollbar-color: #166534 transparent;
        }

        .action-btn {
            background: #14532d;
            color: #bbf7d0;
            border: 2px solid #22c55e;
            padding: 6px 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .action-btn:hover {
            background: #16a34a;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.55);
        }

        .action-btn:active {
            transform: translateY(1px);
        }

        .action-btn:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }

        #orientation-hint {
            display: none;
            width: min(960px, calc(100vw - 20px));
            padding: 8px 12px;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: var(--focus);
            background: var(--panel);
            font: 10px/1.5 monospace, sans-serif;
            text-align: center;
        }

        .action-btn--boss {
            background: #831843;
            border-color: #fb7185;
            color: #ffe4e6;
        }

        .action-btn--jev {
            background: #047857;
            border-color: #34d399;
            color: #ecfdf5;
        }

        /* Bottom instructions badge */
        #instructions {
            width: min(960px, calc(100vw - 20px));
            font-size: 8px;
            color: var(--muted);
            text-align: center;
            line-height: 1.6;
            min-height: 16px;
        }

        #instructions span {
            color: #4ade4a;
        }

        #game-announcements {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 720px) {
            body {
                justify-content: flex-start;
                gap: 8px;
            }

            #top-nav {
                align-items: stretch;
                flex-direction: column;
            }

            .brand small {
                display: block;
                margin-left: 0;
            }

            .btn-group {
                justify-content: flex-start;
            }

            #instructions {
                font-family: monospace, sans-serif;
                font-size: 10px;
            }
        }

        @media (max-width: 720px) and (orientation: portrait) {
            #orientation-hint {
                display: block;
            }
        }

        @media (max-height: 650px) and (orientation: landscape) {
            body {
                justify-content: flex-start;
                gap: 5px;
                padding-block: 5px;
            }

            #top-nav {
                padding-block: 4px;
            }

            .brand small,
            #instructions {
                display: none;
            }

            #game-wrapper {
                max-height: calc(100dvh - 62px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }

            #crt-overlay {
                opacity: 0.25;
            }
        }
        .game-dialog {
            margin: auto;
            width: min(440px, calc(100vw - 24px));
            max-height: calc(100dvh - 24px);
            overflow-y: auto;
            padding: 20px;
            border: 2px solid var(--accent);
            border-radius: 12px;
            background: #052e16;
            color: var(--ink);
            font: 16px/1.5 system-ui, sans-serif;
            touch-action: pan-y;
        }
        .game-dialog::backdrop { background: #020617d9; }
        .game-dialog h2 { margin-bottom: 12px; }
        .game-dialog button, .game-dialog label {
            display: flex; align-items: center; gap: 12px;
            width: 100%; min-height: 48px; margin-top: 8px;
        }
        .game-dialog button {
            background: #064e3b; color: var(--ink); border: 1px solid #4ade8066;
            padding: 10px; border-radius: 6px; font: inherit; cursor: pointer;
        }
        .game-dialog button:disabled { opacity: 0.45; cursor: default; }
        .game-dialog input[type=checkbox] { width: 22px; height: 22px; }
        .game-dialog :focus-visible, .touch-controls button:focus-visible { outline: 3px solid var(--focus); }
        .touch-controls {
            position: absolute; bottom: max(8px, env(safe-area-inset-bottom));
            left: 8px; right: 8px; display: flex; gap: 8px; z-index: 1001;
            pointer-events: none;
        }
        .touch-controls[hidden] { display: none; }
        .touch-controls button {
            pointer-events: auto; touch-action: none; width: 56px; height: 56px;
            border: 2px solid #ffffff88; border-radius: 50%; color: white;
            background: #064e3b; opacity: var(--touch-opacity); font: bold 14px system-ui;
        }
        .touch-controls button:nth-child(3) { margin-left: auto; background: #831843; }
        .touch-controls button:active { opacity: 1; }
        .touch-pause {
            position: absolute; top: 8px; right: 8px; z-index: 1001;
            min-width: 48px; min-height: 48px; border-radius: 8px;
            border: 2px solid #ffffff88; color: white; background: #064e3b;
            font: bold 20px system-ui; touch-action: manipulation;
        }
        .touch-pause[hidden] { display: none; }
        .scene-actions {
            position: absolute; bottom: 12px; left: 12px; right: 12px;
            z-index: 1001; display: flex; justify-content: center; gap: 12px;
        }
        .scene-actions button {
            min-height: 48px; padding: 8px 16px; border: 2px solid #4ade80;
            border-radius: 8px; color: white; background: #064e3b;
            font: bold 16px system-ui; touch-action: manipulation;
        }
        .scene-actions--menu {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px; max-width: 480px; margin-inline: auto;
        }
        @media (pointer: coarse) {
            .action-btn { min-width: 48px; min-height: 48px; }
        }
        @media (any-pointer: coarse) and (orientation: portrait) {
            #game-wrapper {
                height: calc((100vw - 20px) * 9 / 16 + 72px);
                aspect-ratio: auto;
            }
            #game-canvas-container { height: calc(100% - 72px); }
        }
        @media (pointer: coarse) and (orientation: landscape) and (max-height: 650px) {
            #game-wrapper { max-height: calc(100dvh - 86px); }
        }
        #game-wrapper:fullscreen {
            width: 100vw; height: 100dvh; max-height: none; border-radius: 0;
        }
        #game-wrapper:fullscreen #game-canvas-container { height: 100%; }
    </style>
</head>
<body>

    <nav id="top-nav" aria-label="Game controls">
        <div class="brand">RIBBIT'S BIG ADVENTURE <small>FIVE SWAMPS · ONE GOLDEN LOTUS</small></div>
        <div class="btn-group" aria-label="Stage and display controls">
            <button data-dev-only class="action-btn" onclick="loadStage(0)" title="Lilypad Lagoon" aria-label="Play stage 1, Lilypad Lagoon">01</button>
            <button data-dev-only class="action-btn" onclick="loadStage(1)" title="Cattail Canopy" aria-label="Play stage 2, Cattail Canopy">02</button>
            <button data-dev-only class="action-btn" onclick="loadStage(2)" title="Mushroom Mire" aria-label="Play stage 3, Mushroom Mire">03</button>
            <button data-dev-only class="action-btn action-btn--boss" onclick="loadStage(3)" title="The Sunken Citadel" aria-label="Play stage 4 boss, The Sunken Citadel">04 BOSS</button>
            <button data-dev-only class="action-btn action-btn--jev" onclick="loadStage(4)" title="Firefly Marsh" aria-label="Play stage 5, Firefly Marsh">05</button>
            <button id="crt-toggle-btn" class="action-btn" aria-pressed="true" aria-label="Toggle CRT display effect">CRT ON</button>
            <button id="pause-btn" class="action-btn" aria-label="Pause or resume game">PAUSE</button>
            <button id="restart-btn" class="action-btn" aria-label="Restart stage">RETRY</button>
            <button id="fullscreen-btn" class="action-btn" aria-label="Toggle fullscreen">EXPAND</button>
        </div>
    </nav>
    <div id="orientation-hint" role="status">Landscape orientation gives Ribbit more room to run. Portrait play remains supported.</div>

    <div id="game-wrapper">
        <div id="game-canvas-container">
            <div id="crt-overlay"></div>
        </div>
    </div>

    <div id="instructions">
        <span>A / D / ARROWS</span> MOVE &bull; <span>SPACE / W / UP</span> JUMP &bull; <span>X / SHIFT</span> TONGUE &bull; <span>P / ESC</span> PAUSE &bull; <span>R</span> RETRY
    </div>
    <div id="game-announcements" aria-live="polite" aria-atomic="true"></div>

    <!-- Scripts -->
    <script type="module" src="/entry-2d.js"></script>

    <script>
        // Quick Stage Select
        window.loadStage = function(index) {
            if (window.game && window.game.scene) {
                const levels = window.LevelBuilder.getLevels();
                const safeIndex = Math.max(0, Math.min(levels.length - 1, Number(index) || 0));
                window.__rbaLevelQueryConsumed = true;
                window.soundEngine.init();
                window.soundEngine.stopBossMusic();
                window.soundEngine.startMusic(safeIndex);
                ['TitleScene', 'GameOverScene', 'VictoryScene', 'GameScene'].forEach(key => {
                    if (window.game.scene.isActive(key)) {
                        window.game.scene.stop(key);
                    }
                });
                window.game.scene.start('GameScene', {
                    levelIndex: safeIndex,
                    score: 0,
                    fireflies: 0
                });
            }
        };
        if (new URLSearchParams(window.location.search).get('dev') !== '1') {
            document.querySelectorAll('[data-dev-only]').forEach((element) => { element.hidden = true; });
        }

        // Fullscreen toggle
        document.getElementById('pause-btn').addEventListener('click', () => {
            if (window.game?.scene.isActive('GameScene')) window.game.scene.getScene('GameScene').togglePause();
        });
        document.getElementById('restart-btn').addEventListener('click', () => {
            if (window.game?.scene.isActive('GameScene')) window.game.scene.getScene('GameScene').restartStage();
        });
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            const wrapper = document.getElementById('game-wrapper');
            if (!document.fullscreenElement) {
                if (wrapper.requestFullscreen) {
                    wrapper.requestFullscreen();
                } else if (wrapper.webkitRequestFullscreen) {
                    wrapper.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        // CRT scanline toggle
        const crtOverlay = document.getElementById('crt-overlay');
        const crtBtn = document.getElementById('crt-toggle-btn');
        const readSavedSettings = () => {
            try {
                const data = JSON.parse(localStorage.getItem('rba_save_data_v1') || '{}');
                return data.profile && data.profile.settings ? data.profile.settings : {};
            } catch (error) { return {}; }
        };
        const saveDisplaySetting = (key, value) => {
            try {
                const data = JSON.parse(localStorage.getItem('rba_save_data_v1') || '{}');
                data.version = Math.max(2, Number(data.version) || 0);
                data.profile = data.profile || { unlockedStage: 0, bestScore: 0, bestFireflyCount: 0, settings: {}, tutorialFlags: {} };
                data.profile.settings = { ...(data.profile.settings || {}), [key]: value };
                localStorage.setItem('rba_save_data_v1', JSON.stringify(data));
            } catch (error) {}
        };
        let crtActive = readSavedSettings().crt !== false;
        crtOverlay.style.display = crtActive ? 'block' : 'none';
        crtBtn.textContent = crtActive ? 'CRT ON' : 'CRT OFF';
        crtBtn.setAttribute('aria-pressed', String(crtActive));
        crtBtn.addEventListener('click', () => {
            crtActive = !crtActive;
            saveDisplaySetting('crt', crtActive);
            crtOverlay.style.display = crtActive ? 'block' : 'none';
            crtBtn.textContent = crtActive ? 'CRT ON' : 'CRT OFF';
            crtBtn.setAttribute('aria-pressed', String(crtActive));
        });

        document.addEventListener('fullscreenchange', () => {
            const isFullscreen = Boolean(document.fullscreenElement);
            document.getElementById('fullscreen-btn').textContent = isFullscreen ? 'EXIT' : 'EXPAND';
        });
    </script>
</body>
</html>
